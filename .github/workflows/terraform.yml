name: 'CI: Build + Security Scan + Deploy'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Workload Identity Federation — 不存任何 Service Account Key
# 面試重點：WIF 是 GCP 的 keyless authentication，
#   GitHub Actions 拿到的是短效 OIDC token，
#   GCP 驗證 token 的 issuer/subject 後，impersonate Service Account
#   全程沒有長效 key，大幅降低 secret 洩漏風險
permissions:
  contents: read
  id-token: write   # 讓 GitHub 簽發 OIDC token

env:
  PROJECT_ID: project-ba42a5bc-01e3-4ef3-ab9
  REGION: us-central1
  REPO: cloud-platform-repo
  IMAGE_NAME: cloud-platform-lab

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1: Build + Trivy Security Scan
  # 面試問：「你的 CI 是怎麼做 image scanning 的？」
  # 答：「先 build image，再用 Trivy 掃描，
  #       發現 CRITICAL 或 HIGH severity CVE 就 fail pipeline，
  #       阻止有漏洞的 image 進入 Artifact Registry。
  #       這是 shift-left security 的標準做法。」
  # ──────────────────────────────────────────────────────────────────────
  build-and-scan:
    name: 'Build & Trivy Scan'
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (WIF)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/717871666559/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'tf-github-sa@project-ba42a5bc-01e3-4ef3-ab9.iam.gserviceaccount.com'

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 用 git short SHA 當 image tag，確保每個 commit 有唯一可追蹤的 image
    # 這是 GitOps 的基礎：image tag = git commit = 可追蹤的 source of truth
    - name: Generate Image Tag
      id: meta
      run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} .

    # ── Trivy Security Scan ─────────────────────────────────────────────
    # --exit-code 1: 有 CRITICAL/HIGH CVE 就讓 pipeline fail
    # --ignore-unfixed: 只報告有 fix 的 CVE，避免 noise
    # --format table: 在 CI log 中清晰顯示
    # sarif output 可上傳到 GitHub Security tab 做 dashboard（進階功能）
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # Trivy 掃過才 push，確保 registry 裡只有乾淨的 image
    - name: Push Image to Artifact Registry
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

  # ──────────────────────────────────────────────────────────────────────
  # Job 2: Terraform Plan（在 PR 時讓人 review 變更）
  # ──────────────────────────────────────────────────────────────────────
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: build-and-scan    # 確保 image 掃過才跑 infra plan

    defaults:
      run:
        working-directory: ./enterprise_tf/envs/dev

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (WIF)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/717871666559/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'tf-github-sa@project-ba42a5bc-01e3-4ef3-ab9.iam.gserviceaccount.com'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -var="project_id=${{ env.PROJECT_ID }}"
